name: Wake backend

# Render's free tier puts the backend to sleep after ~15 min without traffic,
# and the next visitor waits ~30-60 s while it wakes (the login page shows
# "WAKING SERVER..." and retries on its own). Run this by hand shortly before a
# demo (Actions -> Wake backend -> Run workflow) so nobody has to wait.
#
# It is deliberately not scheduled: GitHub ran a 10-minute schedule here only
# every few hours, which never kept the service awake and only spent the free
# instance hours that all free Render services in a workspace share.
#
# The default target goes through the Vercel frontend, whose /api/* proxy
# forwards to the backend, so no setup is needed. To ping Render directly, set
# a repository variable KEEPALIVE_URL (Settings -> Secrets and variables ->
# Actions -> Variables), e.g. https://<service>.onrender.com/healthz

on:
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend health endpoint
        env:
          URL: ${{ vars.KEEPALIVE_URL || 'https://abb-nexops.vercel.app/api/healthz' }}
        run: |
          # A cold start can take up to a minute: retry for ~2.5 min.
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL" || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "::warning::backend did not answer 200 at $URL"
