# Mosquitto broker for the NexOps compose stack.
#
# The broker is ONLY reachable on the private compose network (no host port is
# published in docker-compose.yml), where the publisher and backend are its
# only clients, so anonymous access is acceptable here. If you publish port
# 1883 or connect a real gateway over an untrusted network, switch to
# `allow_anonymous false` + a password_file (and TLS on 8883), and set
# MQTT_USERNAME / MQTT_PASSWORD (+ MQTT_TLS=1) for the backend and publisher.
listener 1883
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
